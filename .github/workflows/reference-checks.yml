name: Reference checks
on:
  pull_request:
  push:
    branches: [main, 'recovery/**', 'work/**']
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
      - run: npm run check
